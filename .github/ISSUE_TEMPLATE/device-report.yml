name: Device report
description: Report whether FCM Anchor works on your phone, so it can be added to the tested list.
title: "Device report: <model> <ROM version>"
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Run `scripts/check.sh` with the phone connected and paste its output below.
        Wait until the phone has been locked for at least 30 minutes (ideally overnight) before judging the result.
  - type: textarea
    id: check
    attributes:
      label: Output of scripts/check.sh
      render: text
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works — notifications arrive while locked
        - Partly — some apps or overnight still delayed
        - Does not work
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: Apps you tested
      placeholder: WhatsApp, Telegram, Gmail, …
    validations:
      required: true
  - type: dropdown
    id: dual
    attributes:
      label: Tested with Dual Apps (second WhatsApp etc.)?
      options:
        - "No"
        - "Yes — works"
        - "Yes — does not work"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else, e.g. what you had to change on the phone.
